[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandworm-supply-chain-lens"
version = "0.1.0"
description = "Sandworm local security reporting integration"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
sandworm-supply-chain-lens = "sandworm_lens.cli:main"

[tool.setuptools.packages.find]
include = ["sandworm_lens*"]
